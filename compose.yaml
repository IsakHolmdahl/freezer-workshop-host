# The whole hosted side of the workshop. See README.md and docs/deploy-aws.md.
services:
  host:
    build: .
    env_file: .env
    environment:
      DATA_DIR: /data
    volumes:
      - host-data:/data          # stores, tokens and the pass signing key survive a restart
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Front door. With a host name in SITE_ADDRESS it fetches an HTTPS certificate by itself.
  caddy:
    image: caddy:2.8
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      host:
        condition: service_healthy
    restart: unless-stopped

volumes:
  host-data:
  caddy-data:
  caddy-config:
